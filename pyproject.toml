[project]
name = "pollcast"
version = "0.1.0"
description = "Reproducible, config-driven US election forecasting: poll ingest, averages, backtests and pluggable indicators"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "Jonathan Berman" }
]
keywords = ["elections", "polling", "forecasting", "backtesting", "monte-carlo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "gdeltdoc>=1.12.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "pyarrow>=26.0.1",
    "pytrends>=4.9.2",
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://jonathanmaxberman.github.io/pollcast/"
Repository = "https://github.com/jonathanmaxberman/pollcast"
Changelog = "https://github.com/jonathanmaxberman/pollcast/blob/main/CHANGELOG.md"

[project.scripts]
pollcast = "pollcast.cli:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
]
